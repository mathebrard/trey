<div class="flex gap-4" [ngClass]="{
    'flex-row-reverse': isLargeBefore,
    'flex-col': !projet2
  }">
  <!-- Première image -->
  <div class="relative group overflow-hidden flex-[2] lg:flex-[3] cursor-pointer" [ngClass]="{
      'flex-[1_1_100%]': !projet2,
      'flex-[3]': isLargeBefore
    }" (click)="goToProject(projet1)">
    <img [src]="projet1?.mainImage" alt=""
      class="w-full h-full object-cover object-center opacity-0 animate-fadeInUp [animation-delay:0.2s] group-hover:opacity-75 transition-opacity" />
    <div
      class="absolute inset-0 flex items-center justify-center text-white text-2xl font-semibold opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-primary/70">
      {{ projet1?.name }}
    </div>
  </div>

  <!-- Deuxième image -->
  <div class="relative group overflow-hidden flex-[3] lg:flex-[2] cursor-pointer" *ngIf="projet2" [ngClass]="{
      'flex-[2]': isLargeBefore
    }" (click)="goToProject(projet2)">
    <img [src]="projet2.mainImage" alt=""
      class=" w-full h-full object-cover object-centeropacity-0 animate-fadeInUp [animation-delay:0.5s] group-hover:opacity-50 transition-opacity" />
    <div
      class="absolute inset-0 flex items-center justify-center text-white text-2xl font-semibold opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-primary/70">
      {{ projet2.name }}
    </div>
  </div>
</div>
